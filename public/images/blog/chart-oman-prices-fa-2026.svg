  <text x="1150" y="600" text-anchor="end" font-family="Peyda, Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="16" fill="rgba(255,255,255,0.45)">منبع: موجودی زنده پروژه‌ها در irfaninvest.com · تیر ۱۴۰۵</text>

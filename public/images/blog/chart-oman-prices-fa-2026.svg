  <text x="1150" y="352" text-anchor="end" font-family="Peyda, Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="21" fill="rgba(255,255,255,0.92)">مزارع اولیو · جبل سیفه (خانه باغی)</text>
  <text x="345" y="352" text-anchor="end" font-family="Peyda, Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="21" font-weight="700" fill="#ffffff">۷۷٬۲۵۰</text>


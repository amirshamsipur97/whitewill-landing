      <stop offset="0" stop-color="#7e7f1f"/>
      <stop offset="1" stop-color="#b5b63a"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a08339"/>
      <stop offset="1" stop-color="#d3b26a"/>

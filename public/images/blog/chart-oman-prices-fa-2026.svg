  </defs>
  <rect width="1200" height="630" rx="18" fill="#101210"/>
  <rect x="1" y="1" width="1198" height="628" rx="18" fill="none" stroke="rgba(255,255,255,0.09)"/>

  <text x="1150" y="64" text-anchor="end" font-family="Peyda, Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="34" font-weight="700" fill="#ffffff">قیمت شروع پروژه‌های فری‌هولد عمان — ۲۰۲۶</text>
  <text x="1150" y="98" text-anchor="end" font-family="Peyda, Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="19" fill="rgba(255,255,255,0.6)">ارقام به ریال عمانی · هر ریال عمانی ≈ ۲٫۶ دلار آمریکا · همراه با سند فری‌هولد و اقامت</text>

  <!-- grid -->
  <line x1="800" y1="130" x2="800" y2="560" stroke="rgba(255,255,255,0.14)"/>


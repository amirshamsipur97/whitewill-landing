  <rect x="240" y="514" width="560" height="34" rx="7" fill="url(#bar)"/>
  <text x="1150" y="538" text-anchor="end" font-family="Peyda, Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="21" fill="rgba(255,255,255,0.92)">آمازی · هوانا صلاله (شاله ساحلی)</text>

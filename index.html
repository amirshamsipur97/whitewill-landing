    <!-- Google tag (gtag.js): one shared library, two destinations:
           • GA4 Analytics : G-P2PTCKJKYK  (send_page_view:false → manual SPA
             page_views from src/analytics.js, so each page is recorded with its
             own title + content group + language)
           • Google Ads    : AW-17743726667 (Google tag GT-M3KMFWHL). Required so
             Google Ads can DETECT the tag + run conversion tracking. Without
             this config line the Ads tag is absent → "Tag stopped sending data".
         gtag's config() includes the Conversion Linker automatically. -->
    <!-- gtag loads AFTER window.load (+1.5s) so its ~300 ms of JS eval never
         competes with the first paint. The inline gtag() stub below keeps
         queuing every early event into dataLayer; Google's script flushes the
         queue when it arrives, so page_view / conversion attribution is
         unchanged. Leads convert minutes later, not in the first second. -->
    <script>
      (function () {
        function loadGtag() {
          setTimeout(function () {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=G-P2PTCKJKYK';
            document.head.appendChild(s);
          }, 1500);
        }
        if (document.readyState === 'complete') loadGtag();
        else window.addEventListener('load', loadGtag);
      })();
    </script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P2PTCKJKYK', { send_page_view: false });
      gtag('config', 'AW-17743726667');
    </script>

    <!-- Meta (Facebook) Pixel: same deferred pattern as gtag: the fbq stub
         queues events immediately; the real fbevents.js loads after
         window.load (+1.5s) so it never competes with first paint. SPA
         PageView + Lead events are fired from src/analytics.js.
         META_PIXEL_ID is empty until the pixel is created in Meta Business
         Suite. With an empty ID everything below is a silent no-op. -->
    <script>
      (function () {
        var META_PIXEL_ID = window.__META_PIXEL_ID = ''; // set real ID to activate
        if (!META_PIXEL_ID) return;
        var n = window.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!window._fbq) window._fbq = n;
        n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
        n('init', META_PIXEL_ID);
        n('track', 'PageView');
        function loadFbq() {
          setTimeout(function () {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://connect.facebook.net/en_US/fbevents.js';
            document.head.appendChild(s);
          }, 1500);
        }
        if (document.readyState === 'complete') loadFbq();
        else window.addEventListener('load', loadFbq);
      })();
    </script>

    <!-- ─────────────────────────────────────────────────────────────────
         Boot splash: painted on the very first frame (inline, before the
         JS bundle loads) so the user never sees an empty page while the
         bundle parses, the hero video buffers, and Supabase data arrives.
         Black canvas + brand lockup + tagline + dotted spinner. A tiny
         script below fades it out after ~2.3–3s (waits for `load`, capped
         at 3s) and removes it from the DOM. Lives outside #root so React
         never touches it. ─────────────────────────────────────────────── -->
    <style>
      html, body { background: #000; margin: 0; }
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483000; background: #000;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 64px;
        opacity: 1; transition: opacity .6s ease;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      #app-splash.app-splash-hide { opacity: 0; pointer-events: none; }
      .app-splash-inner {
        display: flex; flex-direction: column; align-items: center;
        gap: 22px; padding: 0 24px; transform: translateY(-6px);
      }
      .app-splash-logo {
        width: 200px; height: auto; display: block;
        filter: drop-shadow(0 6px 30px rgba(0,0,0,.5));
        animation: app-splash-rise .9s cubic-bezier(.22,.61,.36,1) both;
      }
      .app-splash-tagline {
        margin: 0; max-width: 600px; text-align: center; color: #fff;
        text-transform: capitalize;
        font-family: "Arsenal SC", "Inter", system-ui, -apple-system, sans-serif;
        font-size: 22px; line-height: 1.5; font-weight: 400; letter-spacing: .3px;
        animation: app-splash-rise .9s cubic-bezier(.22,.61,.36,1) .12s both;
      }
      .app-splash-spinner { position: relative; width: 48px; height: 48px; }
      .app-splash-spinner i {
        position: absolute; left: calc(50% - 3px); top: 1px;
        width: 6px; height: 6px; border-radius: 50%;
        background: #c8bd9c; transform-origin: 3px 23px;
        animation: app-splash-fade 1s linear infinite;
      }
      .app-splash-spinner i:nth-child(1){ transform: rotate(0deg);   animation-delay: -.875s }
      .app-splash-spinner i:nth-child(2){ transform: rotate(45deg);  animation-delay: -.750s }
      .app-splash-spinner i:nth-child(3){ transform: rotate(90deg);  animation-delay: -.625s }
      .app-splash-spinner i:nth-child(4){ transform: rotate(135deg); animation-delay: -.500s }
      .app-splash-spinner i:nth-child(5){ transform: rotate(180deg); animation-delay: -.375s }
      .app-splash-spinner i:nth-child(6){ transform: rotate(225deg); animation-delay: -.250s }
      .app-splash-spinner i:nth-child(7){ transform: rotate(270deg); animation-delay: -.125s }
      .app-splash-spinner i:nth-child(8){ transform: rotate(315deg); animation-delay: 0s }
      @keyframes app-splash-fade { 0% { opacity: 1 } 100% { opacity: .18 } }
      @keyframes app-splash-rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      @media (max-width: 600px) {
        #app-splash { gap: 48px; }
        .app-splash-logo { width: 158px; }
        .app-splash-tagline { font-size: 16px; max-width: 320px; line-height: 1.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-logo, .app-splash-tagline { animation: none; }
        .app-splash-spinner i { animation-duration: 1.8s; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Boot splash (see <style> in <head>). Removed by the script below. -->
    <div id="app-splash" role="status" aria-label="Loading Irfan Investment Group">
      <div class="app-splash-inner">
        <img class="app-splash-logo" src="/logo.svg" width="200" height="80" alt="Irfan Investment Group" />
        <p class="app-splash-tagline" id="app-splash-tagline">Irfan Investment Group is a strategic investment division focused on business growth and international opportunities.</p>
      </div>
      <div class="app-splash-spinner" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <script>
      (function () {
        // Localize the tagline from the persisted language (matches i18n's
        // 'ww_lang' key) so RTL/Arabic and Russian visitors see their copy.
        try {
          // Language is URL-driven now (/ar, /ru, /fa; en = none). Fall back to
          // the persisted choice only for the bare "/".
          var seg = (location.pathname.match(/^\/(ar|ru|fa)(?=\/|$)/) || [])[1];
          var lang = seg || localStorage.getItem('ww_lang') || 'en';
          var taglines = {
            en: 'Irfan Investment Group is a strategic investment division focused on business growth and international opportunities.',
            ru: 'Irfan Investment Group, стратегическое инвестиционное подразделение, ориентированное на рост бизнеса и международные возможности.',
            ar: 'مجموعة عرفان الاستثمارية هي ذراعٌ استثماري استراتيجي يركّز على نمو الأعمال والفرص الدولية.',
            fa: 'مجموعه سرمایه‌گذاری عرفان، بازوی راهبردیِ سرمایه‌گذاری با تمرکز بر رشد کسب‌وکار و فرصت‌های بین‌المللی.'
          };
          document.documentElement.lang = lang;
          var tEl = document.getElementById('app-splash-tagline');
          if (tEl && taglines[lang]) tEl.textContent = taglines[lang];
          if (lang === 'ar' || lang === 'fa') {
            document.documentElement.dir = 'rtl';
            var sp = document.getElementById('app-splash');
            if (sp) { sp.dir = 'rtl'; }
            if (tEl) tEl.style.textTransform = 'none';
          }
        } catch (e) {}

        var splash = document.getElementById('app-splash');
        if (!splash) return;
        var now = function () { return (window.performance && performance.now) ? performance.now() : Date.now(); };
        // Ads landing traffic: every splash millisecond delays the first
        // usable paint, so the brand moment is now short, 900ms minimum,
        // hard-capped at 1500ms even on slow loads.
        var MIN = 500, MAX = 1200, start = now(), done = false;

        function hide() {
          if (done) return; done = true;
          splash.classList.add('app-splash-hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 650);
        }
        function afterLoad() {
          setTimeout(hide, Math.max(0, MIN - (now() - start)));
        }
        if (document.readyState === 'complete') afterLoad();
        else window.addEventListener('load', afterLoad);
        setTimeout(hide, MAX); // hard cap, never lingers past ~3s
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

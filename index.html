<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Resource hints — open TCP/TLS sockets to the third parties we hit
         from the first paint (fonts, Mapbox tiles + analytics, Supabase
         REST/edge functions) so the browser doesn't pay handshake latency
         on the first request to each. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin>
    <link rel="dns-prefetch" href="https://owgvrxipqlusepozlujv.supabase.co">
    <!-- Hero video preload — the hero is the first paint, so start fetching
         its (faststart) MP4 in parallel with the JS bundle. `media` makes the
         browser pick exactly one source: the lighter mobile clip on phones,
         the full clip on larger screens. This is what lets us drop the poster
         image yet still have the first frame land fast (no empty hero). -->
    <link rel="preload" as="video" type="video/mp4" href="/video/hero-mobile.mp4" media="(max-width: 768px)">
    <link rel="preload" as="video" type="video/mp4" href="/video/hero.mp4" media="(min-width: 769px)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Irfan Investment Group — a premium real estate brokerage in Oman, connecting global capital with curated developments across Oman and emerging investment destinations.">
    <title>Irfan Investment — Real Estate Experts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
